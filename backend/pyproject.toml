[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-backend"
version = "0.1.0"
description = "Cloud-Native AI Coding Harness Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.1",
    "docker>=7.0.0",
    "boto3>=1.34.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "pyjwt[crypto]>=2.8.0",
    "python-multipart>=0.0.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["..", "."]
markers = [
    "docker: marks tests as requiring Docker daemon (deselect with '-m \"not docker\"')",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends)
]
