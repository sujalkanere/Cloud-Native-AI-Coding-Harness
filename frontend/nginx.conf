# Map query string to mask sensitive token parameter from access logs
map $query_string $clean_query_string {
    ~*^(.*)(?:&|^)token=[^&]*(.*)$ $1$2;
    default $query_string;
}

map $clean_query_string $masked_request_uri {
    "" $uri;
    default "$uri?$clean_query_string";
}

log_format masked '$remote_addr - $remote_user [$time_local] '
                  '"$request_method $masked_request_uri $server_protocol" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent"';

server {
    listen 80;
    server_name localhost;

    # Allow up to 60MB archive uploads (matching MAX_UPLOAD_MB=50)
    client_max_body_size 60M;

    # Access logs with token query parameter masked
    access_log /var/log/nginx/access.log masked;
    error_log /var/log/nginx/error.log warn;

    # Serve static assets
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy WebSocket streaming endpoint with protocol upgrade
    location ~* ^/api/runs/[^/]+/stream {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Proxy REST API endpoints
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check endpoint for nginx
    location = /healthz {
        access_log off;
        return 200 "healthy\n";
    }
}
